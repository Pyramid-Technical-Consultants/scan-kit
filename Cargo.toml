[workspace]
resolver = "2"
members = [
    "crates/scan-kit-core",
    "crates/scan-kit-io",
    "crates/scan-kit-compute",
    "crates/scan-kit-plot",
    "crates/scan-kit-dicom",
    "crates/scan-kit-mcp",
    "apps/desktop/src-tauri",
]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[workspace.package]
version = "2.0.0-dev"
edition = "2021"
license = "MIT"
publish = false
authors = ["Pyramid Technical Consultants, Inc. <support@ptcusa.com>"]

# Numeric kernels index several parallel arrays and take many scalar inputs.
[workspace.lints.clippy]
needless_range_loop = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

[workspace.dependencies]
scan-kit-core = { path = "crates/scan-kit-core" }
scan-kit-io = { path = "crates/scan-kit-io" }
scan-kit-compute = { path = "crates/scan-kit-compute" }
scan-kit-plot = { path = "crates/scan-kit-plot" }
scan-kit-dicom = { path = "crates/scan-kit-dicom" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util"] }
