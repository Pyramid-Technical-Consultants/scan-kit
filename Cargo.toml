[workspace]
resolver = "2"
members = [
    "crates/scan-kit-core",
    "crates/scan-kit-io",
    "crates/scan-kit-compute",
    "crates/scan-kit-plot",
    "crates/scan-kit-dicom",
    "crates/scan-kit-mcp",
    "apps/desktop/src-tauri",
]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# `tauri dev` and `cargo test` use this profile. Unoptimized, a dose scene took
# 38 s instead of 1.3 s, so the numeric crates and every dependency stay
# optimized. The desktop shell and the MCP server are workspace members, so
# they stay unoptimized and rebuild quickly.
#
# Full debug info on the optimized crates dominated that rebuild: one blank
# line in scan-kit-compute took 47 s, and CI spent about 2 minutes recompiling
# before a test run of about 2 seconds. Line tables keep panic locations.
# Dependencies carry no debug info. A debugger will not see variable values.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.dev.package.scan-kit-core]
opt-level = 3

[profile.dev.package.scan-kit-io]
opt-level = 3

[profile.dev.package.scan-kit-compute]
opt-level = 3

[profile.dev.package.scan-kit-plot]
opt-level = 3

[profile.dev.package.scan-kit-dicom]
opt-level = 3

[workspace.package]
version = "2.1.0-dev"
edition = "2021"
license = "MIT"
publish = false
authors = ["Pyramid Technical Consultants, Inc. <support@ptcusa.com>"]

# Numeric kernels index several parallel arrays and take many scalar inputs.
[workspace.lints.clippy]
needless_range_loop = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

[workspace.dependencies]
scan-kit-core = { path = "crates/scan-kit-core" }
scan-kit-io = { path = "crates/scan-kit-io" }
scan-kit-compute = { path = "crates/scan-kit-compute" }
scan-kit-plot = { path = "crates/scan-kit-plot" }
scan-kit-dicom = { path = "crates/scan-kit-dicom" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util"] }
