name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "41 10 * * 1"
  workflow_dispatch:


# A push to a pull request supersedes the run still in flight for the same
# ref — cancel it instead of paying for both. Branch and tag pushes keep
# their full runs (a merge's red/green signal must not be cancelled by the
# next merge).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript, actions]
    runs-on: ubuntu-22.04
    name: Analyze (${{ matrix.language }})
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
