name: PR base branch

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  develop-not-main:
    if: github.base_ref == 'main' && github.head_ref != 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: Reject feature PRs into main
        run: |
          echo "::error title=Wrong PR base::Day-to-day PRs must target develop, not main. Retarget this PR (Edit → base: develop). The only PRs allowed into main are promotions from develop (release)."
          exit 1
