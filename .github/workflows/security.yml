name: Security

# Advisories are published against code that has not changed, so pull-request
# checks alone miss them. Scan both branches every day and on demand.
on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    strategy:
      fail-fast: false
      matrix:
        ref: [develop, main]
    runs-on: ubuntu-22.04
    name: Advisories (${{ matrix.ref }})

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      # main is still the 2.0 release, so its deny.toml does not yet list
      # RUSTSEC-2026-0543. develop already ignores it: chrono 0.4 has no upgrade.
      - name: Rust advisories
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("deny.toml")
          text = path.read_text()
          if "RUSTSEC-2026-0543" not in text:
              line = '    { id = "RUSTSEC-2026-0543", reason = "direct and transitive; no upgrade" },\n'
              marker = "ignore = [\n"
              start = text.index(marker) + len(marker)
              path.write_text(text[:start] + line + text[start:])
          PY
          cargo deny check advisories

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Shipped npm advisories
        working-directory: apps/desktop
        run: npm audit --omit=dev
