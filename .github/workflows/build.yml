name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rust:
    runs-on: ubuntu-22.04
    name: Rust format, lint, and test

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      # The Tauri shell needs WebKitGTK to build on Linux. Its commands are thin
      # wrappers over the other crates, which carry the tests.
      - name: Lint
        run: cargo clippy --workspace --exclude scan-kit-desktop --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --exclude scan-kit-desktop --locked

      - name: Install cargo-deny and cargo-machete
        run: |
          cargo install cargo-deny --locked --version 0.20.2
          cargo install cargo-machete --locked --version 0.9.2

      - name: Check advisories, licenses, sources, and unused dependencies
        run: |
          cargo deny check
          cargo machete --with-metadata

  plot-wasm:
    runs-on: ubuntu-22.04
    name: Plot wasm and desktop frontend

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Lint the plot crate for wasm32
        run: cargo clippy -p scan-kit-plot --no-deps --target wasm32-unknown-unknown -- -D warnings

      - name: Install the wasm-bindgen CLI that matches Cargo.lock
        shell: bash
        run: |
          VERSION=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          cargo install wasm-bindgen-cli --locked --version "$VERSION"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build and test the desktop frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
          npm test
          npm run lint
          npm run knip

  # The branch ruleset requires a check literally named "Test". This gate
  # keeps that name reporting until the ruleset is updated to the job names
  # above; it only passes when the real check jobs do.
  test:
    needs: [rust, plot-wasm]
    if: always()
    runs-on: ubuntu-22.04
    name: Test

    steps:
      - name: Require the real checks to pass
        run: |
          RESULTS='${{ toJSON(needs.*.result) }}'
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then
            exit 1
          fi

  build:
    needs: [rust, plot-wasm]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: scan-kit-windows
            bundles: nsis
          - os: ubuntu-22.04
            artifact: scan-kit-linux
            bundles: appimage,deb

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.os }})

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install the wasm-bindgen CLI that matches Cargo.lock
        shell: bash
        run: |
          VERSION=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          cargo install wasm-bindgen-cli --locked --version "$VERSION"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev

      - name: Build the desktop bundle
        working-directory: apps/desktop
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv target/release/bundle/nsis/*-setup.exe dist/
          else
            mv target/release/bundle/appimage/*.AppImage dist/
            mv target/release/bundle/deb/*.deb dist/
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    name: Create Release

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Verify tag matches the workspace version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(sed -n '/\[workspace.package\]/,/^\[/p' Cargo.toml | grep '^version' | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match workspace version ($PACKAGE_VERSION)"
            exit 1
          fi

      - name: Prepare release assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mv artifacts/scan-kit-windows/*-setup.exe "artifacts/scan-kit-windows-${VERSION}-setup.exe"
          mv artifacts/scan-kit-linux/*.AppImage "artifacts/scan-kit-linux-amd64-${VERSION}.AppImage"
          mv artifacts/scan-kit-linux/*.deb "artifacts/scan-kit-linux-amd64-${VERSION}.deb"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            "artifacts/scan-kit-windows-${VERSION}-setup.exe" \
            "artifacts/scan-kit-linux-amd64-${VERSION}.AppImage" \
            "artifacts/scan-kit-linux-amd64-${VERSION}.deb"
