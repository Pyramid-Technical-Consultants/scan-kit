name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    name: Test

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-tk \
            libportaudio2 \
            libasound2-dev \
            libxcb-xinerama0 \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libopengl0 \
            libegl1 \
            libdbus-1-3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build,dev]"

      - name: Run tests
        env:
          MPLBACKEND: Agg
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: ${{ github.workspace }}
        run: pytest

  build:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: scan-kit-windows
            exe: dist/scan-kit.exe
          - os: ubuntu-22.04
            artifact: scan-kit-linux
            exe: dist/scan-kit

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.os }})

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-tk \
            libportaudio2 \
            libasound2-dev \
            libxcb-xinerama0 \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libopengl0 \
            libegl1 \
            libdbus-1-3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Build Windows executable
        if: runner.os == 'Windows'
        run: python build.py --clean

      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VERSION=$(python -c "from scan_kit import __version__; print(__version__)")
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            APPIMAGE="scan-kit-linux-amd64-${VERSION}.AppImage"
          else
            APPIMAGE="scan-kit-linux-amd64-${VERSION}-rc.AppImage"
          fi

          python build.py --clean --onedir
          python build.py --appimage "${APPIMAGE}"

          chmod +x "dist/${APPIMAGE}"
          "dist/${APPIMAGE}" --appimage-extract-and-run --version

      - name: Prepare Windows artifact filename
        if: runner.os == 'Windows'
        id: asset
        shell: bash
        run: |
          VERSION=$(python -c "from scan_kit import __version__; print(__version__)")
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "path=dist/scan-kit.exe" >> "$GITHUB_OUTPUT"
          else
            mv dist/scan-kit.exe "dist/scan-kit-windows-${VERSION}-rc.exe"
            echo "path=dist/scan-kit-windows-${VERSION}-rc.exe" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ steps.asset.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/scan-kit-linux-amd64-*.AppImage
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    name: Create Release

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Verify tag matches __version__
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(grep '^__version__' scan_kit/__init__.py | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match __version__ ($PACKAGE_VERSION)"
            exit 1
          fi

      - name: Prepare release assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mv artifacts/scan-kit-windows/scan-kit.exe "artifacts/scan-kit-windows-${VERSION}.exe"
          mv "artifacts/scan-kit-linux-amd64-${VERSION}.AppImage" \
            "artifacts/scan-kit-linux-amd64-${VERSION}.AppImage"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # --force replaces an existing release (e.g. when a tag is moved) without
          # appending duplicate auto-generated notes.
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            --force \
            "artifacts/scan-kit-windows-${VERSION}.exe" \
            "artifacts/scan-kit-linux-amd64-${VERSION}.AppImage"
