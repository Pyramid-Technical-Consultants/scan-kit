# Advisories, licenses, and crate sources for `cargo deny check`.
# Duplicate crate versions are not a gate.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "wasm32-unknown-unknown",
]

[advisories]
yanked = "deny"
ignore = [
    # tauri's Linux GTK stack. No fixed release of proc-macro-error exists.
    { id = "RUSTSEC-2024-0370", reason = "transitive via tauri on Linux; no upgrade" },
    # fontdue 0.9 parses the vendored face with ttf-parser. No fixed release exists.
    { id = "RUSTSEC-2026-0192", reason = "transitive via fontdue; no upgrade" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
